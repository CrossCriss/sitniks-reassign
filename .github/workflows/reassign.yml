name: reassign
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      debug:
        type: string
        default: ""
      window:
        type: string
        default: "15"
concurrency:
  group: reassign
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python reassign.py
        env:
          SITNIKS_TOKEN: ${{ secrets.SITNIKS_TOKEN }}
          PUSHER_EMAIL: ${{ secrets.PUSHER_EMAIL }}
          DEBUG: ${{ inputs.debug }}
          WINDOW_MIN: ${{ inputs.window || '15' }}
